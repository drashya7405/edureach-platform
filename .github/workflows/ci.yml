name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  client:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type-check and build production bundle
        run: npm run build

  server:
    name: Backend (Build & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and compile TypeScript
        run: npm run build

      - name: Run test suite
        env:
          NODE_ENV: test
          PORT: 5001
          JWT_SECRET: ci_test_secret_for_validation_at_least_16_chars
          MONGODB_URI: mongodb://localhost:27017/edureach_test
          GOOGLE_API_KEY: ci_test_dummy_google_api_key
        run: npm test
